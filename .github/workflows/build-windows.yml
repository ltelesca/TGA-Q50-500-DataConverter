name: Build Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build single-file .exe
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name TGA-Q500-DataConverter
          app.py

      - name: Smoke test (reader imports and parses nothing-broken)
        run: python -c "import tga_reader, converter; print(converter.APP_NAME, converter.APP_VERSION)"

      - uses: actions/upload-artifact@v4
        with:
          name: TGA-Q500-DataConverter
          path: dist/TGA-Q500-DataConverter.exe

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TGA-Q500-DataConverter.exe
